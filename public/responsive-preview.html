<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruvia responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ecf1;font-family:system-ui;color:#172325}header{padding:18px 24px;background:white}h1{font-size:18px;margin:0 0 12px}button,select,a{font:inherit;font-size:13px;padding:9px;margin:3px;border:1px solid #ccd3dd;border-radius:5px;background:white;color:#172325}button.active{background:#0248f7;color:white}p{font-size:13px;color:#52616d}main{padding:24px;overflow:auto}iframe{border:0;background:white;box-shadow:0 8px 35px #14213b20;display:block;margin:auto}#stage{margin:auto}#size{font-weight:600}</style><header><h1>Pruvia · 完整响应式预览</h1><div id="controls"></div><select id="section"><option value="">Hero</option><option value="#features">功能演示</option><option value="#about">品牌故事</option><option value="#curriculum">课程</option><option value="#faq">FAQ</option><option value="#updates">订阅与页脚</option></select><button id="fit">适应窗口</button><button id="actual">实际尺寸</button><a href="/" target="_blank">打开网站</a><p><span id="size"></span> · 框内是实际网站；适应窗口仅缩放预览，不改变测试宽度。支持在框内滚动查看整页。</p></header><main><div id="stage"><iframe title="Pruvia responsive website" id="frame"></iframe></div></main><script>const presets=[['小屏手机',320,740],['手机',390,844],['大屏手机',430,932],['iPad 竖屏',820,1180],['iPad 横屏',1180,820],['笔记本',1440,900],['桌面',1920,1080],['超宽屏',2560,1440]];let current=presets[1],fit=true;const frame=document.querySelector('#frame'),stage=document.querySelector('#stage');function resize(){const [,w,h]=current;const scale=fit?Math.min(1,(innerWidth-48)/w):1;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transformOrigin='top left';frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';document.querySelector('#size').textContent=`${current[0]} ${w} × ${h}`;}function section(){const hash=document.querySelector('#section').value;try{const target=hash&&frame.contentDocument.querySelector(hash);frame.contentWindow.scrollTo(0,target?target.getBoundingClientRect().top+frame.contentWindow.scrollY:0)}catch{}}presets.forEach(p=>{const b=document.createElement('button');b.textContent=p[0];b.onclick=()=>{current=p;document.querySelectorAll('#controls button').forEach(x=>x.classList.remove('active'));b.classList.add('active');resize();setTimeout(section,350)};if(p===current)b.classList.add('active');document.querySelector('#controls').append(b)});document.querySelector('#section').onchange=section;document.querySelector('#fit').onclick=()=>{fit=true;resize()};document.querySelector('#actual').onclick=()=>{fit=false;resize()};onresize=resize;frame.src='/';frame.onload=section;resize();</script></html>
